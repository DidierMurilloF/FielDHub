# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

name: R-CMD-check

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 60

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          # The golden snapshots (tests/testthat/_snaps) are recorded on macOS
          - {os: macos-latest, r: 'release', golden: 'true'}
          - {os: ubuntu-latest, r: 'release', golden: 'false'}
          - {os: windows-latest, r: 'release', golden: 'false'}
          - {os: ubuntu-latest, r: 'devel', golden: 'false', http-user-agent: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1', golden: 'false'}
          # Test the exact minimum declared in DESCRIPTION, not only its last patch.
          - {os: ubuntu-latest, r: '4.1.0', golden: 'false'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Run the tests skipped on CRAN, too
      NOT_CRAN: true
      FIELDHUB_GOLDEN: ${{ matrix.config.golden }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
          upload-snapshots: true
