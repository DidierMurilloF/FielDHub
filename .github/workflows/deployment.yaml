name: deployment

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
    paths:
      - "R/**"
      - "inst/**"
      - "DESCRIPTION"
      - "NAMESPACE"
      - "Dockerfile"
      - ".dockerignore"
      - "deployment/**"
      - "tools/*deployment.R"
      - ".github/workflows/deployment.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the pinned deployment image
        run: docker build --tag fieldhub-candidate .
      - name: Verify the non-root installed runtime
        run: docker run --rm --network none --entrypoint Rscript fieldhub-candidate --vanilla check-runtime.R
