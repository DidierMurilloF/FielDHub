site_name: FielDHub
site_description: Free R package and Shiny app for design of experiments. Randomize
  CRD, RCBD, lattice, augmented, p-rep and sparse field trials, with field maps and
  field books.
site_url: https://didiermurillof.github.io/FielDHub/
repo_name: DidierMurilloF/FielDHub
repo_url: https://github.com/DidierMurilloF/FielDHub
docs_dir: .mkdocs-src
site_dir: .mkdocs-site
use_directory_urls: false
theme:
  name: material
  custom_dir: website/overrides
  logo: assets/fieldhub-logo.png
  favicon: assets/favicon.ico
  palette:
    scheme: fieldhub
    primary: custom
    accent: custom
  font:
    text: Lato
    code: IBM Plex Mono
  features:
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.top
  - search.highlight
  - search.suggest
  - content.code.copy
plugins:
- search
hooks:
- website/mkdocs_hooks.py
markdown_extensions:
- attr_list
- def_list
- md_in_html
- tables
- pymdownx.highlight:
    pygments_lang_class: true
- pymdownx.superfences
- toc:
    permalink: true
- pymdownx.arithmatex:
    generic: true
not_in_nav: LICENSE-text.md
validation:
  links:
    absolute_links: relative_to_docs
    anchors: warn
    unrecognized_links: warn
extra:
  keywords:
  - design of experiments
  - experimental design
  - DOE in R
  - R package
  - Shiny app
  - field trials
  - plant breeding
  - agricultural experiments
  - randomization
  - field map
  - field book
  - completely randomized design
  - CRD
  - randomized complete block design
  - RCBD
  - Latin square
  - factorial design
  - split-plot design
  - split-split-plot design
  - strip-plot design
  - alpha lattice
  - square lattice
  - rectangular lattice
  - incomplete block design
  - row-column design
  - augmented design
  - augmented RCBD
  - augmented row-column design
  - partially replicated design
  - p-rep design
  - prep design
  - multi-location trials
  - sparse testing
  - sparse allocation
  - diagonal arrangement
  - unreplicated designs
  - simulate trait data
  - spatial correlation
extra_css:
- assets/fieldhub.css
copyright: "<a href=\"https://www.ndsu.edu/agricultural-data-analytics\">\xA9 Agricultural\
  \ Data Analytics, NDSU</a> \xB7 <a href=\"https://joss.theoj.org/papers/10.21105/joss.03122\"\
  >JOSS paper</a>"
